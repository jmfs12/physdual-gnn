# Configuração Base — PhysDual-GNN
# Todos os caminhos em `paths` são RELATIVOS à raiz do projeto (PHYSDUAL_ROOT no Colab ou raiz do repo localmente).
# NUNCA escreva caminhos absolutos (ex.: /content/drive/...) neste arquivo.

project:
  name: "physdual-gnn"
  phase: 0

seeds: [0, 1, 2, 3, 4]

featurizer:
  version: "v2_onehot78_l1norm"
  atom_feature_dim: 78
  edge_feature_dim: 4
  normalize_atom_features: true

graphdta:
  official_model: "graphdta_gin"
  secondary_model: "graphdta_cnn3"
  drug_in_dim: 78
  protein_vocab_size: 25
  max_seq_len: 1000
  embedding_dim: 128
  gin_hidden_dim: 32
  gin_num_layers: 5
  cnn_num_filters: 32
  cnn_kernel_size: 8
  output_dim: 128
  mlp_hidden_dims: [1024, 256]
  dropout: 0.2
  training:
    optimizer: "adam"
    lr: 0.0005
    weight_decay: 0.0
    use_lr_scheduler: false
    batch_size: 512
    epochs: 500
    patience: 50
    davis_cold_patience: 80
    monitor: "mse"
    save_last_every: 10
    num_workers: 2
    pin_memory: true
    persistent_workers: true

splits:
  available:
    - "random"
    - "cold_drug"
    - "cold_target"
  default: "cold_target"
  ratios:
    train: 0.8
    val: 0.1
    test: 0.1

datasets:
  available:
    - "davis"
    - "kiba"
  default: "davis"
  davis:
    metric_unit: "pKd"
    num_drugs: 68
    num_targets: 442
  kiba:
    metric_unit: "KIBA_score"
    num_drugs: 2111
    num_targets: 229

paths:
  data_dir: "data"
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  cache_dir: "cache"
  esm_cache_dir: "cache/esm_embeddings"
  outputs_dir: "outputs"
  checkpoints_dir: "outputs/checkpoints"
  results_dir: "outputs/results"
  logs_dir: "outputs/logs"

esm:
  # Modelo padrão para extração offline de embeddings em GPU T4/L4 (fp16)
  model_name: "esm2_t33_650M_UR50D"
  esm_dim: 1280
  repr_layer: 33
  freeze_backbone: true
  fp16_inference: true
  batch_tokens: 2048
  max_len: 1022
  overlap: 256

  # Alternativa leve caso haja restrição severa de VRAM ou tempo de extração
  lightweight_alternative:
    model_name: "esm2_t30_150M_UR50D"
    esm_dim: 640
    repr_layer: 30

  # Modelo mínimo usado exclusivamente no smoke test da Fase 0
  smoke_test:
    model_name: "esm2_t6_8M_UR50D"
    esm_dim: 320
    repr_layer: 6

evaluation:
  metrics:
    - "ci"
    - "mse"
    - "pearson"
    - "spearman"
    - "rm2"

physics:
  enabled: false  # Módulo opcional (Fase 6), avaliado por ablação

physdual_phase3:
  model_name: "physdual_gin_esm_mlp"
  drug_in_dim: 78
  gin_hidden_dim: 32
  gin_num_layers: 5
  drug_output_dim: 128
  gin_dropout: 0.2
  esm_dim: 1280
  esm_dropout_in: 0.4
  prot_output_dim: 128
  prot_dropout: 0.3
  prot_activation: "gelu"
  mlp_hidden_dims: [512, 256]
  mlp_dropout: 0.3
  training:
    optimizer: "adamw"
    lr: 0.0005
    weight_decay: 0.001
    use_lr_scheduler: false
    batch_size: 512
    epochs: 500
    patience: 50
    davis_cold_patience: 80
    monitor: "mse"
    save_last_every: 10
    num_workers: 2
    pin_memory: true
    persistent_workers: true
